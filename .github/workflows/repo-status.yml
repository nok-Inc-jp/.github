name: リポジトリの状況

on:
  schedule:
    - cron: "17 */6 * * *" # 6時間ごと（UTC）
  workflow_dispatch: {}
  push: # 表や数え方を直したら、6時間待たずに書き換える（bot の push では動かない）
    branches: [main]
    paths:
      - "scripts/**"
      - "profile/README.md"
      - ".github/workflows/repo-status.yml"

permissions:
  contents: write # 書き換えた README をこのリポジトリに push する

concurrency:
  group: repo-status
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: テスト
        run: python3 -m unittest discover -s tests -v

      - name: 状況を集めて README に書く
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # 公開リポジトリを読むだけなので、最初から付いてくる鍵で足りる
          # 置いたときだけ、非公開のリポジトリの「数だけ」をグラフに足す（名前や中身は出さない）
          ACTIVITY_TOKEN: ${{ secrets.ACTIVITY_TOKEN }}
        run: python3 scripts/repo_status.py --org "${{ github.repository_owner }}" --readme profile/README.md

      - name: 変わっていれば push
        run: |
          git add profile/README.md profile/assets/activity-*.svg
          if git diff --cached --quiet; then
            echo "変わりなし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "リポジトリの状況を更新"
          git push
